name: Build APK

on:
  push:
    paths: ['VgdV_Card/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['VgdV_Card/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: VgdV_Card
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VgdV-Card-apk
          path: |
            VgdV_Card/app/build/outputs/apk/debug/*.apk
            VgdV_Card/app/build/outputs/apk/release/*.apk
