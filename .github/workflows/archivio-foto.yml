name: ArchivioFoto

on:
  push:
    paths: ['ArchivioFoto/**', '.github/workflows/archivio-foto.yml']
  pull_request:
    paths: ['ArchivioFoto/**', '.github/workflows/archivio-foto.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ArchivioFoto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installa
        run: python -m pip install ".[volti,test]"
      - name: Test
        run: python -m pytest -v tests
      - name: Comando installato
        run: archivio --version

  eseguibile:
    # App autonoma (nessun Python da installare), compilata e provata sul sistema reale
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ArchivioFoto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa
        run: python -m pip install ".[volti]" pyinstaller
      - name: Compila
        run: python build_app.py
      - name: Prova l'eseguibile (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE=dist/ArchivioFoto/ArchivioFoto.exe
          "$EXE" --version
          "$EXE" init "$RUNNER_TEMP/prova"
          cd "$RUNNER_TEMP/prova" && "$GITHUB_WORKSPACE/ArchivioFoto/$EXE" config && "$GITHUB_WORKSPACE/ArchivioFoto/$EXE" verifica
          "$GITHUB_WORKSPACE/ArchivioFoto/$EXE" versione --log | head -3
          cd "$GITHUB_WORKSPACE/ArchivioFoto" && powershell -Command "Compress-Archive -Path dist/ArchivioFoto -DestinationPath ArchivioFoto-Windows.zip"
      - name: Prova l'eseguibile (macOS)
        if: runner.os == 'macOS'
        run: |
          EXE=dist/ArchivioFoto.app/Contents/MacOS/ArchivioFoto
          "$EXE" --version
          "$EXE" init "$RUNNER_TEMP/prova"
          (cd "$RUNNER_TEMP/prova" && "$GITHUB_WORKSPACE/ArchivioFoto/$EXE" config && "$GITHUB_WORKSPACE/ArchivioFoto/$EXE" verifica)
          "$EXE" versione --log | head -3
          ditto -c -k --keepParent dist/ArchivioFoto.app ArchivioFoto-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: ArchivioFoto/ArchivioFoto-*.zip

  release:
    # Pubblica a ogni push con test ed eseguibili verdi
    needs: eseguibile
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' ArchivioFoto/archiviofoto/__init__.py)
          zip -qr ArchivioFoto-sorgenti.zip ArchivioFoto -x 'ArchivioFoto/tests/*' '*/__pycache__/*'
          { echo "## Download"; \
            echo "- **Windows**: ArchivioFoto-Windows.zip → estrai e apri ArchivioFoto.exe (nessuna installazione)"; \
            echo "- **macOS** (Apple Silicon M1/M2/M3/M4): ArchivioFoto-macOS.zip → estrai e apri ArchivioFoto.app"; \
            echo "- **Sorgenti** (Mac Intel, Linux o uso da riga di comando): ArchivioFoto-sorgenti.zip"; echo; \
            echo "Istruzioni: ArchivioFoto/INSTALLAZIONE.md (build ${GITHUB_SHA::7})."; echo; \
            cat ArchivioFoto/CHANGELOG.md; } > notes.md
          gh release delete archiviofoto --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create archiviofoto ArchivioFoto-Windows.zip ArchivioFoto-macOS.zip ArchivioFoto-sorgenti.zip -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ArchivioFoto v$VERSION" --notes-file notes.md --latest=false
